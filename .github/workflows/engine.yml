name: Engine CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run --extra dev pytest

      - name: Run Ruff
        run: uv run --extra dev ruff check holovec tests scripts

      - name: Run mypy
        run: uv run --extra dev mypy holovec

      - name: Build manylinux wheel
        env:
          CIBW_PLATFORM: linux
        run: uvx cibuildwheel --output-dir wheelhouse

      - name: Check built wheel
        run: uvx twine check wheelhouse/*
