name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run release gate
        run: uv run --extra dev pytest tests/ -q

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Build sdist
        env:
          HOLOVEC_SKIP_RUST_BUILD: "1"
        run: uv build --sdist

      - name: Check sdist
        run: uvx twine check dist/*

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*

  build-wheel:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        env:
          HOLOVEC_BUILD_RUST: "1"
        run: uv build --wheel

      - name: Check wheel
        run: uvx twine check dist/*

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  publish:
    needs: [release-gate, build-sdist, build-wheel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
