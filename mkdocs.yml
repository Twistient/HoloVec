site_name: HoloVec
site_description: Vector Symbolic Architectures for Python
site_url: https://twistient.github.io/HoloVec/
repo_url: https://github.com/Twistient/HoloVec
repo_name: Twistient/HoloVec

theme:
  name: shadcn
  icon: assets/icon.svg
  show_title: true
  show_stargazers: true
  pygments_style:
    light: shadcn-light
    dark: github-dark

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: numpy

markdown_extensions:
  # Standard extensions
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false

  # Code highlighting - MUST use codehilite for shadcn theme copy button
  - codehilite:
      guess_lang: false

  # Fenced code blocks with mermaid support
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid

  # UI components
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

  # Math support
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Overview: overview.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Core Concepts: getting-started/core-concepts.md
  - Architecture:
    - Overview: architecture/index.md
    - Backends: architecture/backends.md
    - Spaces: architecture/spaces.md
  - Models:
    - Comparison: models/index.md
    - FHRR: models/fhrr.md
    - GHRR: models/ghrr.md
    - MAP: models/map.md
    - HRR: models/hrr.md
    - VTB: models/vtb.md
    - BSC: models/bsc.md
    - BSDC: models/bsdc.md
    - BSDC-SEG: models/bsdc-seg.md
  - Encoders:
    - Overview: encoders/index.md
    - Fractional Power: encoders/fractional-power.md
    - Thermometer & Level: encoders/thermometer-level.md
    - Sequences: encoders/sequence.md
    - Spatial: encoders/spatial.md
  - Retrieval:
    - Overview: retrieval/index.md
    - Cleanup Strategies: retrieval/cleanup.md
  - Guides:
    - Patterns: guides/patterns.md
    - Performance: guides/performance.md
    - Troubleshooting: guides/troubleshooting.md
  - Reference:
    - API: reference/api.md
    - Glossary: reference/glossary.md
    - Bibliography: reference/bibliography.md
